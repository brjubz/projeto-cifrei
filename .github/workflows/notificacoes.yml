name: Enviar Notificações Push

on:
  schedule:
    # A cada 15 minutos — verifica e envia notificações pendentes
    - cron: '*/15 * * * *'
  workflow_dispatch: # permite disparar manualmente pelo GitHub

jobs:
  enviar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependências
        run: npm install
        working-directory: scripts

      - name: Enviar notificações pendentes
        run: node enviar-notificacoes.js
        working-directory: scripts
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
